plugins { id 'java-library' }
repositories { mavenCentral() }
dependencies {
    api 'com.google.code.gson:gson:2.8.0'
    api 'org.tukaani:xz:1.12'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
java {
    // Keep canonical Java8 output stable across the Gradle9/JDK25 and FG6/JDK21 launchers.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('compileJava', JavaCompile) { options.release = 8 }
tasks.named('compileTestJava', JavaCompile) { options.release = 8 }
test {
    useJUnitPlatform()
    doFirst { systemProperty 'fixture.classpath', sourceSets.test.runtimeClasspath.asPath }
}
