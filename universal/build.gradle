plugins { id 'java-library' }
repositories { mavenCentral() }
sourceSets {
    loaderStubs { java.srcDir 'src/compileOnly/java' }
    main { compileClasspath += sourceSets.loaderStubs.output }
    test {
        compileClasspath += sourceSets.loaderStubs.output
        runtimeClasspath += sourceSets.loaderStubs.output
    }
}
dependencies {
    implementation 'com.google.code.gson:gson:2.8.0'
    testImplementation project(':core')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }
tasks.named('compileJava') { dependsOn tasks.named('compileLoaderStubsJava') }
tasks.named('jar', Jar) {
    archiveBaseName = 'tailcat-universal-bootstrap'
    // Loader SDK declarations are compile-only and must never replace real loader classes.
    exclude 'net/fabricmc/**', 'net/minecraftforge/**', 'net/neoforged/**'
}
tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    doFirst { systemProperty 'bootstrap.jar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath }
}
