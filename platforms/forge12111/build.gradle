plugins { id 'net.minecraftforge.gradle' version '7.0.40' }
ext.minecraftVersion = '1.21.11'
ext.javaVersion = 21
ext.versionDirectory = '1211'
ext.loaderName = 'forge'
ext.loaderFamily = 'forge12111'
ext.sourceFamily = 'common12111'
apply from: rootProject.file('platforms/shared.gradle')
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}
dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.11-61.2.4')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}
