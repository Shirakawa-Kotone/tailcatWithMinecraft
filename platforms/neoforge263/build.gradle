plugins { id 'net.neoforged.moddev' }
ext.minecraftVersion = '26.3'
ext.javaVersion = 25
ext.versionDirectory = '263'
ext.loaderName = 'neoforge'
ext.loaderFamily = 'neoforge263'
ext.sourceFamily = 'common263'
apply from: rootProject.file('platforms/shared.gradle')
neoForge {
    enable { version = '26.3.0.99'; disableRecompilation = true }
    runs { client { client() } }
    mods { tailcat { sourceSet sourceSets.main } }
}
