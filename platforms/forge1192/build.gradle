plugins { id 'net.neoforged.moddev.legacyforge' }
ext.minecraftVersion = '1.19.2'
ext.javaVersion = 17
ext.versionDirectory = '1192'
ext.loaderName = 'forge'
ext.loaderFamily = 'forge1192'
ext.sourceFamily = 'commonLegacy1192'
apply from: rootProject.file('platforms/shared.gradle')
legacyForge {
    enable { forgeVersion = '1.19.2-43.5.2'; disableRecompilation = true }
    runs { client { client() } }
    mods { tailcat { sourceSet sourceSets.main } }
}
